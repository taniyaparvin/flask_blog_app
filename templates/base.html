<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MyBlog{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="{{ url_for('home') }}">MyBlog</a>
    <div class="nav-links">
      <a href="{{ url_for('home') }}">Home</a>
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('my_posts') }}">My posts</a>
        <a href="{{ url_for('create_post') }}" class="btn">New post</a>
        <a href="{{ url_for('logout') }}">Logout ({{ current_user.username }})</a>
      {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Register</a>
      {% endif %}
    </div>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
