{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>{{ 'Edit post' if post else 'Write a new post' }}</h1>
  <form method="post">
    <label>Title</label>
    <input type="text" name="title" value="{{ post.title if post else '' }}" required>

    <label>Category</label>
    <select name="category">
      {% for c in categories %}
        <option value="{{ c }}" {% if post and post.category == c %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>

    <label>Body</label>
    <textarea name="body" rows="10" required>{{ post.body if post else '' }}</textarea>

    <button type="submit" class="btn">{{ 'Save changes' if post else 'Publish' }}</button>
  </form>
</div>
{% endblock %}
